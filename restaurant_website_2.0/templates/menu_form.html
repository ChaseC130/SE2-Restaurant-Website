{% extends 'base.html' %}
{% block title %}{{ 'Edit' if item else 'Add' }} Menu Item{% endblock %}
{% block content %}
<div class="form-card wide">
  <h1>{{ 'Edit' if item else 'Add' }} Menu Item</h1>
  <form method="post" class="two-col">
    <label>Name <input name="name" value="{{ item.name if item else '' }}" required></label>
    <label>Category <input name="category" value="{{ item.category if item else '' }}" required></label>
    <label>Price <input type="number" step="0.01" min="0" name="price" value="{{ item.price if item else '' }}" required></label>
    <label>Description <textarea name="description" required>{{ item.description if item else '' }}</textarea></label>
    <label class="check"><input type="checkbox" name="is_popular" {% if item and item.is_popular %}checked{% endif %}> Popular item</label>
    <label class="check"><input type="checkbox" name="is_available" {% if not item or item.is_available %}checked{% endif %}> Available on public menu</label>
    <button class="button" type="submit">Save Item</button>
  </form>
</div>
{% endblock %}
